listen_port: 9000
backends:
  - host: backend1
    port: 9000
  - host: backend2
    port: 9000
  - host: backend3
    port: 9000
algorithm: "round_robin"
syn_flood_threshold: 10
syn_flood_block_duration: 6

l7_port: 8000

routes:
  - path: "/api/users"
    backends:
      - host: backend1
        port: 9000
      - host: backend2
        port: 9000
  - path: "/api/payments"
    backends:
      - host: backend3
        port: 9000

bot_detection: false
max_pool_size: 100
